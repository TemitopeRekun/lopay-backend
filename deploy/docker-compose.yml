# Production stack for the LoPay backend — self-hosted on a single Oracle Cloud
# A1 (arm64) VM. One command brings up the whole thing:
#
#   cd deploy && docker compose up -d --build
#
# Layout: only Caddy is exposed to the internet (ports 80/443). It terminates TLS
# and reverse-proxies to the app over a PRIVATE compose network. Postgres and
# Redis publish NO host ports, so they are unreachable from outside the VM.
#
# Compose auto-loads `deploy/.env` for the ${...} values below. Copy
# `.env.example` to `.env` and fill it in first.

name: lopay-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # No `ports:` — private network only.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    # No `ports:` — private network only.

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    # App secrets come from .env; the infra wiring below is fixed by construction
    # so it's always internally consistent (and `environment` overrides env_file).
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      # Same-host private network — no TLS between app and DB (see prisma.service.ts).
      DATABASE_SSL: disable
      REDIS_URL: redis://redis:6379
      # One reverse proxy (Caddy) in front, so trust exactly one hop for client IPs.
      TRUST_PROXY: '1'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    # No `ports:` — only Caddy reaches the app, over the private network.

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    environment:
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
